spring:
  application:
    name: ledger-consumer

  datasource:
    url: jdbc:postgresql://postgres.transaction-service.orb.local/payment_ledger_view
    username: ledger
    password: ledger

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledger-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

kafka:
  topics:
    transaction-events: transaction.events
    transaction-events-dlt: transaction.events.dlt
