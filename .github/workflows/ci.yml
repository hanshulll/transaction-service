name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build reactor
        run: ./mvnw -B clean install

      - name: Run tests (unit + integration + ArchUnit)
        run: ./mvnw -B test

  build-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Package jars
        run: ./mvnw -B package -DskipTests

      - name: Build ledger-app image
        run: docker build -t ledger-app ./ledger-app

      - name: Build ledger-consumer image
        run: docker build -t ledger-consumer ./ledger-consumer
